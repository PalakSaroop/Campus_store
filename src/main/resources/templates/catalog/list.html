<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Catalog</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #eef2f3, #dfe9f3);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .filter {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        input {
            padding: 8px;
        }

        button {
            padding: 8px 12px;
            background: #009688;
            color: white;
            border: none;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #009688;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 18px;
            background: #009688;
            color: white;
            border-radius: 8px;
            text-decoration: none;
        }

        .pagination {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 Product Catalog</h1>

    <!-- 🔍 FILTER FORM -->
    <form method="get" action="/catalog" class="filter">
        <input type="text" name="name" placeholder="Search name">
        <input type="number" name="categoryId" placeholder="Category ID">

        <label>
            <input type="checkbox" name="inStock" value="true"> In Stock
        </label>

        <button type="submit">Filter</button>
    </form>

    <!-- TABLE -->
    <table>
        <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Price ($)</th>
            <th>Stock</th>
            <th>Action</th>
        </tr>

        <tr th:each="product : ${products}">
            <td th:text="${product.name}"></td>
            <td th:text="${product.description}"></td>
            <td th:text="${product.price}"></td>
            <td th:text="${product.stockQty}"></td>

            <!-- 🔥 DETAILS BUTTON -->
            <td>
                <a th:href="@{/product/{id}(id=${product.id})}">View</a>
            </td>
        </tr>
    </table>

    <!-- 🔁 PAGINATION -->
    <div class="pagination">
        <a th:if="${currentPage > 0}"
           th:href="@{/catalog(page=${currentPage - 1})}">Previous</a>

        <span> Page [[${currentPage}]] </span>

        <a th:if="${currentPage + 1 < totalPages}"
           th:href="@{/catalog(page=${currentPage + 1})}">Next</a>
    </div>

    <!-- NAV BUTTONS -->
    <div class="nav-buttons">
        <a href="/orders/create" class="btn">🛒 Create Order</a>
        <a href="/orders/history" class="btn">📦 My Orders</a>
    </div>

</div>

</body>
</html>
