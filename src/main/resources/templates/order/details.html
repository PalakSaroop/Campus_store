<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order Details</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #eef2f3, #dfe9f3);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h1, h2 {
            text-align: center;
            color: #333;
        }

        .details {
            margin-top: 20px;
            line-height: 1.8;
            font-size: 16px;
        }

        .details strong {
            color: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #673AB7;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .back-btn {
            display: block;
            width: 220px;
            margin: 25px auto;
            padding: 12px;
            background: #673AB7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            text-decoration: none;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #5E35B1;
            transform: scale(1.05);
        }

        .summary-box {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧾 Order Details</h1>

    <div class="summary-box">
        <div class="details">
            <p><strong>Order ID:</strong> <span th:text="${order.orderId}"></span></p>
            <p><strong>Date:</strong> <span th:text="${order.createdAt}"></span></p>
            <p><strong>Status:</strong> <span th:text="${order.status}"></span></p>
            <p><strong>Total ($):</strong> <span th:text="${order.total}"></span></p>
        </div>
    </div>

    <h2>🛍️ Items</h2>

    <table>
        <tr>
            <th>Product</th>
            <th>Quantity</th>
            <th>Unit Price ($)</th>
        </tr>

        <tr th:each="item : ${order.items}">
            <td th:text="${item.product.name}"></td>
            <td th:text="${item.qty}"></td>
            <td th:text="${item.unitPrice}"></td>
        </tr>
    </table>

    <a href="/orders/history" class="back-btn">⬅ Back to History</a>
</div>

</body>
</html>
