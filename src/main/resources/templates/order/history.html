<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Orders</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #eef2f3, #dfe9f3);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #2196F3;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .btn-link {
            text-decoration: none;
            color: #2196F3;
            font-weight: bold;
        }

        .btn-link:hover {
            text-decoration: underline;
        }

        .primary-btn {
            display: block;
            width: 220px;
            margin: 25px auto;
            padding: 12px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            text-decoration: none;
            transition: 0.3s;
        }

        .primary-btn:hover {
            background: #1976D2;
            transform: scale(1.05);
        }

        .error {
            text-align: center;
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 My Order History</h1>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <table>
        <tr>
            <th>Order ID</th>
            <th>Date</th>
            <th>Status</th>
            <th>Total ($)</th>
            <th>Details</th>
        </tr>

        <tr th:each="order : ${orders}">
            <td th:text="${order.id}"></td>
            <td th:text="${order.createdAt}"></td>
            <td th:text="${order.status}"></td>
            <td th:text="${order.total}"></td>
            <td>
                <a th:href="@{/orders/{id}(id=${order.id})}" class="btn-link">View</a>
            </td>
        </tr>
    </table>

    <a href="/orders/create" class="primary-btn">➕ Create New Order</a>
</div>

</body>
</html>
