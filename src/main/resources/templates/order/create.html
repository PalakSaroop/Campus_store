<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Order</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #eef2f3, #dfe9f3);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        input[type="number"] {
            width: 60px;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .btn {
            display: block;
            width: 200px;
            margin: 25px auto;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        .link {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #4CAF50;
            font-weight: bold;
        }

        .link:hover {
            text-decoration: underline;
        }

        .error {
            text-align: center;
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🛒 Create Your Order</h1>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form th:action="@{/orders/create}" th:object="${createOrderRequest}" method="post">
        <table>
            <tr>
                <th>Product</th>
                <th>Price ($)</th>
                <th>Stock</th>
                <th>Quantity</th>
            </tr>

            <tr th:each="product, stat : ${products}">
                <td th:text="${product.name}"></td>
                <td th:text="${product.price}"></td>
                <td th:text="${product.stockQty}"></td>

                <td>
                    <input type="hidden" th:field="*{items[__${stat.index}__].productId}" />
                    <input type="number" th:field="*{items[__${stat.index}__].qty}" min="0" placeholder="0" />
                </td>
            </tr>
        </table>

        <button type="submit" class="btn">Place Order</button>
    </form>

    <a href="/orders/history" class="link">📦 View My Orders</a>
</div>

</body>
</html>
