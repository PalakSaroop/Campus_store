<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Orders</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #eef2f3, #dfe9f3);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #FF9800;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        select {
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            margin-left: 5px;
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            background-color: #FF9800;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #F57C00;
            transform: scale(1.05);
        }

        .back-btn {
            display: block;
            width: 220px;
            margin: 25px auto;
            padding: 12px;
            background: #FF9800;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            text-decoration: none;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #F57C00;
            transform: scale(1.05);
        }

        .error {
            text-align: center;
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🛠️ Admin Order Management</h1>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <table>
        <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Date</th>
            <th>Status</th>
            <th>Total ($)</th>
            <th>Change Status</th>
        </tr>

        <tr th:each="order : ${orders}">
            <td th:text="${order.id}"></td>
            <td th:text="${order.customer.email}"></td>
            <td th:text="${order.createdAt}"></td>
            <td th:text="${order.status}"></td>
            <td th:text="${order.total}"></td>
            <td>
                <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post">
                    <select name="status">
                        <option value="FULFILLED">FULFILLED</option>
                        <option value="CANCELLED">CANCELLED</option>
                    </select>
                    <button type="submit">Update</button>
                </form>
            </td>
        </tr>
    </table>

    <a href="/admin/dashboard" class="back-btn">⬅ Back to Dashboard</a>
</div>

</body>
</html>
